apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fintech-core-strict-isolation
  namespace: prod-financial
spec:
  podSelector:
    matchLabels:
      app: fintech-core
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432 # Secure Database internal port only

