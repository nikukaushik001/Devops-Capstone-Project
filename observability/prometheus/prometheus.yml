global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "fintech-payment-core"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fintech-core-service:80"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: application

